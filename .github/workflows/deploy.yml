name: Validate and deploy UNSEEN

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: unseen-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 25
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 25.2.1
          cache: npm

      - name: Use the lockfile's npm version
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Run production tests
        run: npm test

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 25
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 25.2.1
          cache: npm

      - name: Use the lockfile's npm version
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Build the Cloudflare Worker
        run: npm run build

      - name: Check deployment configuration
        id: deploy_config
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          APP_ALLOWED_EMAILS: ${{ secrets.UNSEEN_ALLOWED_EMAILS }}
          APP_ACCESS_ISSUER: ${{ secrets.UNSEEN_CLOUDFLARE_ACCESS_ISSUER }}
          APP_ACCESS_AUD: ${{ secrets.UNSEEN_CLOUDFLARE_ACCESS_AUD }}
        run: |
          if [[ -n "$CF_API_TOKEN" && -n "$CF_ACCOUNT_ID" && -n "$APP_OPENAI_KEY" && -n "$APP_ALLOWED_EMAILS" && -n "$APP_ACCESS_ISSUER" && -n "$APP_ACCESS_AUD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Deployment skipped: configure the production repository secrets listed in README.md."
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.deploy_config.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.125.0"
          command: deploy --config dist/server/wrangler.json
          secrets: |
            OPENAI_API_KEY
            UNSEEN_ALLOWED_EMAILS
            UNSEEN_AUTH_PROVIDER
            UNSEEN_CLOUDFLARE_ACCESS_ISSUER
            UNSEEN_CLOUDFLARE_ACCESS_AUD
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UNSEEN_ALLOWED_EMAILS: ${{ secrets.UNSEEN_ALLOWED_EMAILS }}
          UNSEEN_AUTH_PROVIDER: cloudflare_access
          UNSEEN_CLOUDFLARE_ACCESS_ISSUER: ${{ secrets.UNSEEN_CLOUDFLARE_ACCESS_ISSUER }}
          UNSEEN_CLOUDFLARE_ACCESS_AUD: ${{ secrets.UNSEEN_CLOUDFLARE_ACCESS_AUD }}
